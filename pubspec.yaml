name: task_app  # KEEP AS IS - DON'T CHANGE
description: PYLO - a personal offline-first task management application
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  path_provider: ^2.1.0
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  intl: ^0.18.1
  table_calendar: ^3.0.9
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  path: ^1.9.0
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4

  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  home_widget: ^0.9.3
  file_picker: ^12.0.0
  image_cropper: ^9.0.0
  crypto: ^3.0.6
  audioplayers: ^6.1.0
  supabase_flutter: ^2.17.2

  # Face ID / on-device ML authentication
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_commons: ^0.13.0
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/raw/
    - assets/models/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
